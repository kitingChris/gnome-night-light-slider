<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3f73"/>
      <stop offset="1" stop-color="#16213f"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd28a"/>
      <stop offset="1" stop-color="#f39c3c"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd28a"/>
      <stop offset="1" stop-color="#f39c3c"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="78" cy="38" r="27" fill="#000"/>
    </mask>
  </defs>

  <!-- tile with a darker base edge, GNOME app-icon style -->
  <rect x="8" y="12" width="112" height="108" rx="22" fill="#0e1630"/>
  <rect x="8" y="8" width="112" height="106" rx="22" fill="url(#sky)"/>

  <!-- stars -->
  <circle cx="92" cy="74" r="2.2" fill="#fff" opacity=".85"/>
  <circle cx="100" cy="30" r="1.6" fill="#fff" opacity=".6"/>
  <circle cx="30" cy="26" r="1.6" fill="#fff" opacity=".6"/>

  <!-- crescent moon -->
  <circle cx="60" cy="50" r="29" fill="url(#moon)" mask="url(#crescent)"/>

  <!-- slider -->
  <rect x="24" y="92" width="80" height="8" rx="4" fill="#fff" opacity=".22"/>
  <rect x="24" y="92" width="50" height="8" rx="4" fill="url(#fill)"/>
  <circle cx="74" cy="96" r="9" fill="#fff"/>
  <circle cx="74" cy="96" r="9" fill="none" stroke="#000" stroke-opacity=".15"/>
</svg>
